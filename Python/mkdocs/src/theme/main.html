<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ page.title }}</title>
</head>
<body>
{% if page.is_homepage %}
<h1>{{ config.site_name }}</h1>
<ul>
{% for p in nav.pages %}{% if p.file.src_uri.startswith('posts/') %}<li><a href="{{ p.url|url }}">{{ p.title }}</a></li>
{% endif %}{% endfor %}</ul>
{% else %}
<h1>{{ page.title }}</h1>
{{ page.content }}
{% endif %}
</body>
</html>
