name: metadata

on:
  push:
    branches: [master, chore/modernize-2026]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generators.json is current and every generator.json is valid
        run: python3 tools/build_index.py --check
      - name: Install test dependencies
        run: python3 -m pip install -r tools/requirements-dev.txt
      - name: Metadata tests
        run: python3 -m pytest tests/metadata -q
